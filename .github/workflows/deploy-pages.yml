name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall runs scripts/vendor.mjs, which copies the WebAssembly
      # runtime out of node_modules into public/vendor/.
      - run: npm ci --omit=dev

      # Pages must already be switched on for the repository:
      # Settings -> Pages -> Source: GitHub Actions. The action's
      # `enablement: true` cannot do it - creating a Pages site needs admin
      # rights that GITHUB_TOKEN does not have.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
